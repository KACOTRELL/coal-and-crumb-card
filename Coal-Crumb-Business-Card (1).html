<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kevin Cotrell — Coal & Crumb Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0e0c0a;
    --panel: #17130f;
    --cream: #f3ead7;
    --cream-dim: #cfc4ab;
    --rust: #c0632e;
    --rust-dim: #8a4a26;
    --hairline: rgba(192,99,46,0.35);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body{
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(192,99,46,0.10), transparent 55%),
      var(--bg);
  }

  .card{
    width: 100%;
    max-width: 420px;
    border: 1px solid var(--hairline);
    padding: 40px 32px 32px;
    position: relative;
  }

  .card::before{
    content: "";
    position: absolute;
    inset: 7px;
    border: 1px solid rgba(192,99,46,0.18);
    pointer-events: none;
  }

  .logo-wrap{
    display: flex;
    justify-content: center;
    margin-bottom: 28px;
  }

  .logo-wrap img{
    width: 148px;
    height: 148px;
    border-radius: 50%;
  }

  .name{
    font-family: 'Bitter', serif;
    font-weight: 800;
    font-size: 26px;
    text-align: center;
    letter-spacing: 0.01em;
    margin: 0 0 4px;
    color: var(--cream);
  }

  .title{
    text-align: center;
    font-size: 14px;
    color: var(--rust);
    font-weight: 600;
    margin: 0 0 22px;
  }

  .rule{
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 22px 0;
  }
  .rule .line{
    flex: 1;
    height: 1px;
    background: var(--hairline);
  }
  .rule .mark{
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--rust);
  }

  .company{
    text-align: center;
    font-family: 'Bitter', serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.06em;
    color: var(--cream-dim);
    margin: 0 0 2px;
  }

  .tagline{
    text-align: center;
    font-size: 12.5px;
    font-style: italic;
    color: var(--rust-dim);
    margin: 0 0 6px;
  }

  .actions{
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 22px;
  }

  .btn{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 16px;
    text-decoration: none;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 500;
    border: 1px solid var(--hairline);
    color: var(--cream);
    background: transparent;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .btn:hover{
    border-color: var(--rust);
    background: rgba(192,99,46,0.08);
  }

  .btn.primary{
    background: var(--rust);
    border-color: var(--rust);
    color: #17130f;
    font-weight: 600;
  }
  .btn.primary:hover{
    background: #a9552a;
  }

  .btn svg{ width: 17px; height: 17px; flex-shrink: 0; }

  .footer-note{
    text-align: center;
    font-size: 11.5px;
    color: var(--rust-dim);
    margin-top: 26px;
    letter-spacing: 0.02em;
  }

  @media (prefers-reduced-motion: no-preference){
    .card{
      animation: rise 0.5s ease-out;
    }
  }
  @keyframes rise{
    from{ opacity: 0; transform: translateY(8px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  a.btn:focus-visible, button.btn:focus-visible{
    outline: 2px solid var(--rust);
    outline-offset: 2px;
  }
</style>
</head>
